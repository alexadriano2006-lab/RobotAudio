<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Transforme escritas em audio</h1>
    <input type="text" id="textInput" placeholder="Digite o texto aqui"
    maxlength = "200">

    <button id="convertButton" >Converter para Áudio</button>
    <audio id="audioOutput" controls></audio>

    <script>
        const textInput = document.getElementById('textInput');
        const convertButton = document.getElementById('convertButton');
        const audioOutput = document.getElementById('audioOutput');

        convertButton.addEventListener('click', () => {

            const text = textInput.value;
            if (text) {
                fetch(`http://localhost:3000/api/users/tts?texto=${encodeURIComponent(text)}`)
                    .then((response) => {
                        if (!response.ok) {
                            throw new Error(`Erro do backend: ${response.status}`);
                        }
                        return response.blob();
                    })
                    .then(blob => {
                        audioOutput.src = URL.createObjectURL(blob);
                        return audioOutput.play();
                    })
                    .catch(error => console.error('Erro ao converter texto em áudio:', error));
            } else {
                alert('Por favor, digite algum texto.');
            }
        });

    </script>

    
</body>
</html>
